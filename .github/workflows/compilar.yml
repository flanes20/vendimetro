name: Compilar Vendímetro

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            chip: Apple-Silicon
          - runner: macos-15-intel
            chip: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install pywebview pyinstaller pillow openpyxl
      - name: Probar el programa en Mac
        run: |
          python pruebas/prueba_e2e.py
          python pruebas/prueba_excel.py
      - name: Compilar la aplicación
        run: >
          python -m PyInstaller --noconfirm --windowed --name "Vendímetro"
          --osx-bundle-identifier com.vendimetro.app --icon icono.png
          --add-data "web:web" --add-data "icono.ico:." app.py
      - name: Comprobar que la aplicación compilada arranca
        run: |
          export VENDIMETRO_DATOS="$RUNNER_TEMP/datos"
          VENDIMETRO_SIN_VENTANA=1 "dist/Vendímetro.app/Contents/MacOS/Vendímetro" &
          PID=$!
          sleep 10
          curl -sf http://127.0.0.1:8765/api/info
          curl -sf http://127.0.0.1:8765/ | grep -q "Vendímetro"
          # cerrarla para que no deje ocupados los archivos al armar el .dmg
          kill $PID; wait $PID || true
      - name: Crear instalador (.dmg)
        run: |
          mkdir dmg
          cp -R "dist/Vendímetro.app" dmg/
          ln -s /Applications dmg/Aplicaciones
          cp "Cómo usar en Mac.txt" dmg/
          # en los Mac de GitHub hdiutil a veces falla con "Resource busy": se reintenta
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Vendímetro" -srcfolder dmg -ov -format UDZO "Vendimetro-Mac-${{ matrix.chip }}.dmg" && break
            [ $i = 5 ] && exit 1
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Vendimetro-Mac-${{ matrix.chip }}
          path: "*.dmg"
          retention-days: 3  # los instaladores quedan en Releases; esto evita llenar el espacio de GitHub

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywebview pyinstaller pillow openpyxl
      - name: Probar el programa en Windows
        run: |
          python pruebas/prueba_e2e.py
          python pruebas/prueba_excel.py
      - name: Compilar
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "Vendímetro" --icon icono.ico --add-data "web;web" --add-data "icono.ico;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vendimetro-Windows
          path: dist/*.exe
          retention-days: 3

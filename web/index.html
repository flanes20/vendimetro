<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendímetro</title>
<link rel="stylesheet" href="fonts/fuentes.css">
<style>
/* Layout: barra lateral fija color medianoche (navegación de app de gestión) + área de trabajo clara con cabecera de página, selector de período y tarjetas de datos */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #111725;
  --ink-2: #384152;
  --muted: #687185;
  --line: #e2e5eb;
  --line-2: #eef0f4;
  --accent: #2f55d4;
  --accent-rgb: 47, 85, 212;
  --accent-ink: #ffffff;
  --accent-soft: #e8edfd;
  --c2: #d4861a;
  --good: #12805c; --good-soft: #e1f3ec;
  --warn: #a66a09; --warn-soft: #fbf0dc;
  --crit: #c2362b; --crit-soft: #fbe6e4;
  --side: #0f1626; --side-2: #18213a; --side-ink: #c9d0e0; --side-muted: #7d88a3; --side-act: #ffffff;
  --feat: #e8edfd; --feat-line: #c9d4f7; --feat-k: #41589f; --feat-v: #1b3492; --feat-h: #14204a; --feat-ink: #2d3b64; --feat-up: #12805c; --feat-down: #c2362b;
  --shadow: 0 1px 2px rgba(17, 23, 37, .05), 0 4px 16px rgba(17, 23, 37, .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0f18; --surface: #131927; --surface-2: #182032; --ink: #e7eaf2; --ink-2: #c3c9d6; --muted: #8e97ab;
    --line: #253049; --line-2: #1d263a; --accent: #7f9bff; --accent-rgb: 127, 155, 255; --accent-ink: #0b1020; --accent-soft: #1f2a4d;
    --c2: #f0aa45; --good: #4fcf9b; --good-soft: #143528; --warn: #f2bd5c; --warn-soft: #3a2c10; --crit: #ff8f86; --crit-soft: #3d1b1a;
    --side: #080b13; --side-2: #141b2d; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --feat: #080b13; --feat-line: #080b13; --feat-k: #7d88a3; --feat-v: #ffffff; --feat-h: #ffffff; --feat-ink: #c9d0e0; --feat-up: #4fcf9b; --feat-down: #ff8f86;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f18; --surface: #131927; --surface-2: #182032; --ink: #e7eaf2; --ink-2: #c3c9d6; --muted: #8e97ab;
  --line: #253049; --line-2: #1d263a; --accent: #7f9bff; --accent-rgb: 127, 155, 255; --accent-ink: #0b1020; --accent-soft: #1f2a4d;
  --c2: #f0aa45; --good: #4fcf9b; --good-soft: #143528; --warn: #f2bd5c; --warn-soft: #3a2c10; --crit: #ff8f86; --crit-soft: #3d1b1a;
  --side: #080b13; --side-2: #141b2d; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --feat: #080b13; --feat-line: #080b13; --feat-k: #7d88a3; --feat-v: #ffffff; --feat-h: #ffffff; --feat-ink: #c9d0e0; --feat-up: #4fcf9b; --feat-down: #ff8f86;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* ---------- estructura ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 18px; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; flex: none; }
.brand b { display: block; color: #fff; font-family: var(--f-display); font-size: 15px; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--side-muted); padding: 12px 10px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--side-ink); padding: 8px 10px; border-radius: 8px; font: inherit; font-weight: 500; cursor: pointer; }
.nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.nav button:hover { background: var(--side-2); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-2); color: var(--side-act); box-shadow: inset 3px 0 0 var(--c2); }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--crit); color: #fff; border-radius: 99px; padding: 0 7px; }
.dbstat { margin-top: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--side-muted); padding: 10px; border-radius: 8px; background: var(--side-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--side-muted); flex: none; }
.dot.on { background: #4fcf9b; box-shadow: 0 0 0 3px rgba(79, 207, 155, .2); }
.dot.demo { background: #f0aa45; }

.main { min-width: 0; display: flex; flex-direction: column; }
.head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; padding-block: 24px 16px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.head .sub { color: var(--muted); margin-top: 2px; }
.head-r { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#content { padding-block: 0 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.demo-bar { margin-inline: max(28px, env(safe-area-inset-left, 0px)) max(28px, env(safe-area-inset-right, 0px)); margin-top: 16px; background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--r); padding: 10px 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; height: auto; z-index: 20; flex-direction: row; align-items: center; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); padding-top: calc(8px + env(safe-area-inset-top, 0px)); gap: 10px; overflow-x: auto; overflow-y: hidden; }
  .brand div { display: none; }
  .brand { padding: 0; }
  .nav { flex-direction: row; }
  .nav .grp, .dbstat span { display: none; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  .nav button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--c2); }
  .dbstat { margin-top: 0; padding: 8px; }
  .head, #content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .demo-bar { margin-inline: 16px; }
}

/* ---------- controles ---------- */
button, select, input, textarea { font: inherit; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.dan { color: var(--crit); }
.btn.dan.solid { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.lg { padding: 13px 18px; font-size: 16px; border-radius: 10px; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 60px; }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 5px 11px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.per { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.per select, .per input { width: auto; }
.ic { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 16px; }

.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fld .hint { font-size: 12px; color: var(--muted); }
.fld .hint.up { color: var(--good); }
.fld .hint.down { color: var(--crit); }
input.mal, input.mal:focus { border-color: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.fgrid .w2 { grid-column: span 2; }
@media (max-width: 520px) { .fgrid .w2 { grid-column: auto; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }

/* ---------- tarjetas y datos ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.card-h p { color: var(--muted); font-size: 12.5px; }
.card-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.card-b.flush { padding: 0; }
.cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.cols.c-wide { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.pila { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
@media (max-width: 1100px) { .cols.c-wide { grid-template-columns: 1fr; } }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: 23px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.feat { background: var(--feat); border-color: var(--feat-line); }
.kpi.feat .k, .kpi.feat .s { color: var(--feat-k); }
.kpi.feat .v { color: var(--feat-v); }
.up { color: var(--good); font-weight: 600; } .down { color: var(--crit); font-weight: 600; }
.kpi.feat .up { color: var(--feat-up); } .kpi.feat .down { color: var(--feat-down); }

.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; white-space: nowrap; }
td.nw { white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.sel td { background: var(--surface-2); }
tr.anul td { color: var(--muted); text-decoration: line-through; }
tr.anul td:last-child, tr.anul td.keep { text-decoration: none; }
tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; background: var(--surface-2); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
.t-acts { display: flex; gap: 6px; justify-content: flex-end; }
.bar-in { display: flex; align-items: center; gap: 8px; }
.bar-in i { display: block; height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }
.prodname b { display: block; font-weight: 600; }
td.prodname { min-width: 170px; }
.prodname span { font-size: 12px; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.low { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.out { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pct-tot { font-size: 14px; margin-bottom: 14px; }
.pct-tot b { font-family: var(--f-display); font-size: 20px; margin-left: 4px; }
.pctbars { display: flex; gap: 10px; align-items: flex-end; overflow-x: auto; padding-top: 8px; border-bottom: 2px solid var(--line); }
.pcol { flex: 1 1 0; min-width: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: default; }
.pcol .pn { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; max-height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pcol .pv { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.pcol .pm { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pcol .pbar { width: 100%; max-width: 76px; background: var(--accent); border-radius: 4px 4px 0 0; display: flex; justify-content: center; padding-top: 8px; margin-top: 3px; }
.pcol .pbar span { color: var(--accent-ink); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.otros-det { margin-top: 12px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.otros-det > b { color: var(--ink); }
.otros-det span b { color: var(--ink); font-weight: 600; }
.otros-det i { font-style: normal; }
.pctbars { gap: 6px; }
.pcol { min-width: 50px; overflow: hidden; }
.pcol .pm { font-size: 10.5px; }
.pcol .pn { font-size: 11.5px; }
.pcol .pv { font-size: 15px; }
.pcol .pbar span { font-size: 10.5px; }
.pcol-otros { cursor: pointer; border-radius: 6px; }
.pcol-otros:hover .pbar, .pcol-otros:focus-visible .pbar { background: var(--accent); }
.pcol-otros:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.pcol .pver { font-size: 11px; font-weight: 600; color: var(--accent); text-align: center; }
.otros-hint { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
.otros-hint b { color: var(--ink); }
.hbars { display: flex; flex-direction: column; gap: 12px; }
.hb-t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; margin-bottom: 4px; }
.hb-n { font-weight: 600; min-width: 0; }
.hb-n small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.hb-v { white-space: nowrap; }
.hb-v i { font-style: normal; color: var(--muted); margin-left: 8px; display: inline-block; min-width: 44px; text-align: right; }
.hb-bar { height: 8px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
.hb-bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.hb-bar i.gris, .pcol .pbar.otros { background: var(--muted); }
.mg-sub { display: block; font-size: 11.5px; color: var(--muted); }
.pcol .pbar.otros { background: var(--muted); }
.pcol:hover .pbar { filter: brightness(1.12); }
.cbox { position: relative; }
.cbox-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0, 0, 0, .18); max-height: 320px; overflow-y: auto; padding: 4px; }
.cbox-list button { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
.cbox-list button:hover, .cbox-list button[aria-current] { background: var(--accent-soft); }
.cbox-list button.nuevo { color: var(--accent); font-weight: 600; justify-content: flex-start; border-top: 1px solid var(--line-2); border-radius: 0 0 6px 6px; }
.cbox-list p { margin: 6px 10px; }
.cbox-list svg { width: 16px; height: 16px; flex: none; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
button.chip { cursor: pointer; font-family: inherit; }
button.chip:hover { box-shadow: 0 0 0 2px var(--line); }

/* ---------- gráficos ---------- */
.chart { overflow-x: auto; }
.chart-in { position: relative; min-width: 560px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.chart .gl { stroke: var(--line-2); }
.chart .zero { stroke: var(--line); }
.chart .b1 { fill: var(--accent); }
.chart .neg { fill: var(--crit); }
.chart .ln { fill: none; stroke: var(--c2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--c2); stroke: var(--surface); stroke-width: 2; }
.chart .hl { fill: transparent; }
.chart .hl.on { fill: var(--accent-soft); opacity: .6; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: var(--ink); opacity: .04; }
.chart .emptytxt { font-family: var(--f-body); font-size: 13px; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
.legend i.l2 { height: 3px; border-radius: 2px; background: var(--c2); }
.tip { position: absolute; transform: translate(-50%, calc(-100% - 10px)); background: var(--side); color: #fff; border-radius: 8px; padding: 8px 11px; font-size: 12.5px; pointer-events: none; white-space: nowrap; z-index: 3; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.tip b { display: block; margin-bottom: 3px; font-weight: 600; }
.tip div { display: flex; gap: 14px; justify-content: space-between; }
.tip span { color: var(--side-muted); }

/* ---------- punto de venta ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 18px; align-items: start; }
@media (max-width: 1000px) { .pos { grid-template-columns: 1fr; } }
.pos-search { display: flex; gap: 10px; flex-wrap: wrap; }
.pos-search input { flex: 1 1 240px; font-size: 15px; padding: 10px 12px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.cats button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 108px; }

// Va primero y en JavaScript simple: así también anota el error si un Mac antiguo no puede leer el resto del programa.
(function () {
  function anotar(mensaje, detalle) {
    var pantalla = "inicio";
    try { pantalla = S.page; } catch (e) {}
    try {
      var x = new XMLHttpRequest(); x.open("POST", "/api/error"); x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ pantalla: pantalla, mensaje: String(mensaje), detalle: String(detalle || ""), navegador: navigator.userAgent }));
    } catch (e) {}
    try { toast("Algo falló en esta pantalla. Quedó anotado en errores.txt (Ajustes → Abrir carpeta de datos).", true); }
    catch (e) {
      var d = document.getElementById("errFatal");
      if (!d && document.body) { d = document.createElement("div"); d.id = "errFatal"; d.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:99;padding:12px 14px;border-radius:8px;background:#c2362b;color:#fff;font:14px system-ui,sans-serif"; document.body.appendChild(d); }
      if (d) d.textContent = "Vendímetro no pudo cargar bien en este computador: " + mensaje;
    }
  }
  window.addEventListener("error", function (e) { anotar(e.message, (e.error && e.error.stack) || (e.filename + ":" + e.lineno)); });
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason || {}; anotar(r.message || r, r.stack); });
})();
</script>

const LOC = (navigator.language || "").startsWith("es") ? navigator.language : "es-AR";
// Formato chileno siempre ("4.500" y "2,5"), aunque el computador esté en otro español que usa "4,500".

const nf = { format: n => fnum(n, 2) };

/* ===================== datos derivados ===================== */

function niceScale(min, max) {

}
function chart(el, { labels, tips, bar, line, barName = "Ventas", lineName = "Ganancia", every = 1, sel = -1, H = 250, extra = [] }) {

  let hl = "", bars = "", xl = "";
  labels.forEach((l, i) => {
    if (i === sel) hl += `<rect class="hl on" x="${L + band * i}" y="${T}" width="${band}" height="${ih}"/>`;
    const v = bar[i], bx = cx(i) - bw / 2;
    if (v > 0) {
      const top = y(v), y0 = y(0), r = Math.min(4, bw / 2, y0 - top);
      bars += `<path class="b1" d="M${bx},${y0}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + bw - r}Q${bx + bw},${top} ${bx + bw},${top + r}V${y0}Z"/>`;
    } else if (v < 0) bars += `<rect class="neg" x="${bx}" y="${y(0)}" width="${bw}" height="${y(v) - y(0)}"/>`;
    if (i % every === 0) xl += `<text x="${cx(i)}" y="${H - 9}" text-anchor="middle">${esc(l)}</text>`;
  });
  let ln = "";

    if (n <= 40) ln += line.map((v, i) => `<circle class="pt" cx="${cx(i)}" cy="${y(v)}" r="3.2"/>`).join("");

  const emp = vacio ? `<text class="emptytxt" x="${L + iw / 2}" y="${T + ih / 2}" text-anchor="middle">Sin movimientos en este período</text>` : "";
  const legend = line ? `<div class="legend"><span><i></i>${esc(barName)}</span><span><i class="l2"></i>${esc(lineName)}</span></div>` : "";
  el.innerHTML = `${legend}<div class="chart-in"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(barName)}">${hl}${g}${bars}${ln}${xl}${emp}${hits}</svg><div class="tip" hidden></div></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.addEventListener("mouseover", e => {
    const i = e.target.dataset?.i; if (i == null) return;
    tip.innerHTML = `<b>${esc(tips[i])}</b><div><span>${esc(barName)}</span>${money(bar[i])}</div>${line ? `<div><span>${esc(lineName)}</span>${money(line[i])}</div>` : ""}${extra[i] ? `<div><span>${esc(extra[i][0])}</span>${esc(extra[i][1])}</div>` : ""}`;
    tip.style.left = (cx(+i) / W * 100) + "%";
    tip.style.top = (y(Math.max(bar[i], line ? line[i] : 0, 0)) / H * 100) + "%";

function serie(list, a, b) {

  } else if (days <= 1100) {

  } else {

  return { labels: lab, tips: tip, bar: ven, line: gan, every: keys.length > 40 ? 5 : keys.length > 24 ? 2 : 1, extra: cnt.map(c => ["Ventas", nf0.format(c)]), keys };
}

}

        const n = numX(f[col]); if (n == null) { errores.push(`Fila ${f._fila || i + 2}: «${f[col]}» no es un número válido en ${k}`); return; }

function calcPos() {

  for (const it of ps.items) { const p = S.data.productos[it.pid]; sub += it.cant * it.precio; costo += it.cant * (p?.costo || 0); }
  const dv = num(ps.desc), desc = ps.descTipo === "%" ? sub * Math.min(dv, 100) / 100 : Math.min(dv, sub);
  const total = Math.round((sub - desc) * 100) / 100;
  return { sub, desc, total, costo, gan: total - costo, vuelto: num(ps.recibido) - total };
}

// gráficos extra de Ventas: evolución, categorías, ganancia por producto, clientes y formas de pago
function graficosVentas(vs, t) {
  const prods = porProducto(vs);
  const cats = {}; prods.forEach(p => { cats[p.cat] = (cats[p.cat] || 0) + p.total; });
  const catR = Object.entries(cats).map(([nombre, v]) => ({ nombre, v })).sort((a, b) => b.v - a.v);
  const ganR = prods.map(p => ({ nombre: p.nombre, v: p.total - p.costo, sub: `margen ${pct(p.total ? (p.total - p.costo) / p.total * 100 : NaN)} · ${nf.format(p.cant)} u.` })).sort((a, b) => b.v - a.v);
  const cliR = agrupar(vs, v => v.cli || "_", v => nombreCli(v)).map(c => ({ nombre: c.nombre, v: c.total, sub: `${c.n} ${c.n === 1 ? "compra" : "compras"}` }));
  const pagR = agrupar(vs, v => v.pago, v => PAGOS[v.pago] || v.pago).map(p => ({ nombre: p.nombre, v: p.total, sub: `${p.n} ${p.n === 1 ? "venta" : "ventas"}` }));
  return `<div class="cols c-wide">${card("Ventas y ganancia · " + etiqueta(), `<div class="chart" id="chVentas"></div>`, { sub: P.modo === "dia" ? "Por hora" : P.modo === "anio" ? "Por mes" : "Por día" })}
    ${card("Ventas por categoría", hbars(catR, { total: t.total, otros: "categorías" }), { sub: "Qué parte del total es cada categoría" })}</div>
  <div class="cols">${card("Productos que más ganancia dejan", hbars(ganR, { total: t.ganancia, otros: "productos" }), { sub: `Ganancia bruta total ${money(t.ganancia)} = 100%` })}
    ${card("Mejores clientes", hbars(cliR, { total: t.total, otros: "clientes" }), { sub: "Quién compró más en el período" })}
    ${card("Formas de pago", hbars(pagR, { total: t.total }), { sub: "Cómo te pagaron" })}</div>`;
}

function pgProductos() {
  const [a, b] = rango(), q = S.prodQ.trim().toLowerCase();
  const vend = Object.fromEntries(porProducto(ventasEn(a, b)).map(p => [p.pid, p]));
  const all = prodsOrden();
  const list = all.filter(([, p]) => (!S.prodCat || p.cat === S.prodCat) && (!S.prodBajo || (p.stock || 0) <= (p.min ?? 5)) && (!q || p.nombre.toLowerCase().includes(q) || (p.codigo || "").toLowerCase().includes(q)));
  let uds = 0, vc = 0, vp = 0;

function render() {
  const c = $("#content");
  const act = document.activeElement, actId = act && c.contains(act) ? act.id : null;
  const selS = actId && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
  const scroll = window.scrollY;

}

/* ===================== borrador: venta y compra en curso ===================== */
// Se guarda solo mientras se arma, para no perderlo si el programa se cierra.
let borradorT = 0, borradorPrevio = null;
function trabajoPendiente() {
  if (S.pos.items.length) return `Tienes una venta sin cobrar de ${money(calcPos().total)}`;
  if (S.compra.items.length) return "Tienes una compra sin registrar";
  return "";
}
function borrador() {
  if (S.modo !== "db") return;
  clearTimeout(borradorT);
  borradorT = setTimeout(async () => {
    const pos = { ...S.pos, q: "" };
    const datos = JSON.stringify({ pos, compra: S.compra });
    window.pywebview?.api?.set_pendiente?.(trabajoPendiente());
    if (datos === borradorPrevio) return;
    try { await api("PUT", rutaDoc("config", "borrador"), JSON.parse(datos)); borradorPrevio = datos; } catch (e) { console.warn("borrador", e); }
  }, 400);
}
function recuperarBorrador(b) {
  if (!b) return;
  borradorPrevio = JSON.stringify(b);
  if (b.pos) { Object.assign(S.pos, b.pos, { q: "" }); S.pos.items = (S.pos.items || []).filter(it => S.data.productos[it.pid]); }
  if (b.compra) { S.compra = { ...S.compra, ...b.compra }; S.compra.items = (S.compra.items || []).filter(it => S.data.productos[it.pid]); }
  if (S.pos.items.length) { S.page = "pos"; setTimeout(() => toast("Recuperamos la venta que quedó sin cobrar"), 300); }
  else if (S.compra.items.length) setTimeout(() => toast("Recuperamos la compra que quedó sin registrar"), 300);
}
function pedirCierre() {
  abrir("¿Cerrar Vendímetro?", `<p>${esc(trabajoPendiente())}.</p><p class="muted">No se pierde: queda guardada y la encontrarás igual la próxima vez que abras el programa.</p>
    <div class="dlg-f"><button class="btn pri" data-act="cerrar">Seguir trabajando</button><button class="btn" data-act="salirPrograma">Cerrar el programa</button></div>`);
}

/* ===================== avisos y diálogos ===================== */
function toast(t, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.textContent = t;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), err ? 5000 : 3200);
}
const dlg = $("#dlg");
// Ventana propia en lugar de <dialog>: las versiones antiguas de macOS no lo soportan.
function abrir(titulo, html, wide) {
  $("#dlgT").textContent = titulo; $("#dlgB").innerHTML = html;
  dlg.classList.toggle("wide", !!wide); dlg.hidden = false; dlg.scrollTop = 0;
  const f = $("#dlgB").querySelector("input,select") || $("#dlgB").querySelector("button"); if (f) f.focus();
}
function cerrar() { dlg.hidden = true; $("#dlgB").innerHTML = ""; }
dlg.addEventListener("mousedown", e => { if (e.target === dlg) cerrar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !dlg.hidden) cerrar(); });
let confirmFn = null;
function confirmar(titulo, texto, boton, fn) {
  confirmFn = fn;
  abrir(titulo, `<p>${texto}</p><div class="dlg-f"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn dan solid" data-act="confirmOk">${boton}</button></div>`);
}
async function seguro(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { console.error(e); toast(errTxt(e), true); return false; }
  finally { render(); }
}

async function descargar(nombre, data) {
  const nativo = window.pywebview?.api?.guardar_archivo;
  if (nativo) {
    try { if (await nativo(nombre, data)) toast("Archivo guardado"); }
    catch (e) { toast("No se pudo guardar el archivo.", true); }
    return;
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data])); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { toast("Las descargas no están disponibles aquí.", true); }
}
function toCSV(rows) {
  const cell = v => { if (typeof v === "number") return String(Math.round(v * 100) / 100).replace(".", ","); const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return "﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n");
}

  },
  ajuste: id => {
    const p = S.data.productos[id];
    abrir(`Stock · ${p.nombre}`, `<p>Stock actual: <b>${nf.format(p.stock || 0)}</b> unidades.</p><form data-form="ajuste" data-id="${id}" class="fgrid">
      <div class="fld w2"><label for="ajTipo">Tipo de movimiento</label><select id="ajTipo"><option value="entrada">Entrada (llegó mercadería)</option><option value="salida">Salida (uso interno, regalo)</option><option value="merma">Merma (vencido, roto, robo)</option><option value="conteo">Conteo físico (fijar el stock real)</option></select></div>
      <div class="fld"><label for="ajCant">Cantidad</label><input id="ajCant" type="number" min="0" step="1" required></div>
      <div class="fld"><label for="ajNota">Motivo</label><input id="ajNota" placeholder="Opcional"></div>

  },
  kardex: id => {
    const p = S.data.productos[id]; const mv = [];
    for (const v of M().ventas) for (const it of v.items || []) if (it.pid === id) {
      mv.push({ f: v.fecha, h: v.hora, t: `Venta ${v.folio ? "#" + v.folio : ""}`, d: -it.cant, ref: nombreCli(v) });
      if (v.estado === "anulada") mv.push({ f: v.anuladaEn || v.fecha, h: "", t: `Anulación ${v.folio ? "#" + v.folio : ""}`, d: it.cant, ref: "" });
    }
    for (const c of M().compras) for (const it of c.items) if (it.pid === id) mv.push({ f: c.fecha, h: c.hora || "", t: "Compra", d: it.cant, ref: S.data.proveedores[c.prov]?.nombre || c.nota || "" });
    for (const a of M().ajustes) if (a.pid === id) mv.push({ f: a.fecha, h: a.hora || "", t: { entrada: "Entrada", salida: "Salida", merma: "Merma", conteo: "Conteo físico", inicial: "Stock inicial" }[a.tipo] || a.tipo, d: a.delta, ref: a.nota || "" });
    mv.sort((x, y) => (y.f + y.h).localeCompare(x.f + x.h));
    let bal = p.stock || 0;
    const rows = mv.slice(0, 300).map(m => { const r = `<tr><td class="nw">${fechaCorta(m.f)} <span class="muted">${esc(m.h)}</span></td><td>${esc(m.t)}</td><td>${esc(m.ref)}</td><td class="n ${m.d >= 0 ? "up" : "down"}">${m.d >= 0 ? "+" : ""}${nf.format(m.d)}</td><td class="n">${nf.format(bal)}</td></tr>`; bal -= m.d; return r; });
    abrir(`Movimientos · ${p.nombre}`, `<p class="muted">Historial de entradas y salidas, del más reciente al más antiguo. Stock actual: <b>${nf.format(p.stock || 0)}</b>.</p>${table(["Fecha", "Movimiento", "Detalle", "#Cantidad", "#Saldo"], rows, "Sin movimientos registrados")}`, true);

  // compras y proveedores
  cmpAdd: () => {
    const pid = $("#cmpProd").value, p = S.data.productos[pid], cant = Math.floor(num($("#cmpCant").value));

  },
  cmpDel: id => { leerCompraForm(); S.compra.items.splice(+id, 1); render(); },
  cmpGuardar: async () => {
    leerCompraForm(); const c = S.compra; if (!c.items.length) return;
    const fecha = c.fecha || hoy();
    const compra = { id: uid("k"), fecha, hora: fecha === hoy() ? ahora() : "", prov: c.prov, nota: c.nota.trim(), items: c.items.map(it => ({ ...it, nombre: S.data.productos[it.pid]?.nombre || "" })), total: c.items.reduce((s, it) => s + it.cant * it.costo, 0) };
    const ok = await seguro(async () => {
      await agregarALista("compras", fecha.slice(0, 7), compra);
      for (const it of compra.items) { const p = S.data.productos[it.pid]; if (!p) continue; await parche("productos", it.pid, { stock: (p.stock || 0) + it.cant, ...(c.actCosto ? { costo: it.costo } : {}) }); }
    }, `Compra registrada por ${money(compra.total)}. El stock se actualizó.`);
    if (ok) { S.compra = { prov: c.prov, items: [], nota: "", fecha: "", actCosto: c.actCosto }; render(); }
  },
  delCompra: id => {
    const [k, cid] = id.split("|");
    confirmar("Anular compra", "La compra se eliminará y sus unidades se descontarán del stock.", "Anular compra", () => seguro(async () => {
      const old = await cambiarEnLista("compras", k, cid, () => null);
      if (old) for (const it of old.items) await moverStock(it.pid, -it.cant);
    }, "Compra anulada"));
  },
  editProv: id => {
    const p = id ? S.data.proveedores[id] : {};
    abrir(id ? "Editar proveedor" : "Nuevo proveedor", `<form data-form="prov" data-id="${id}" class="fgrid"><div class="fld w2"><label for="fvNombre">Nombre</label><input id="fvNombre" required value="${esc(p.nombre || "")}"></div><div class="fld"><label for="fvContacto">Contacto</label><input id="fvContacto" value="${esc(p.contacto || "")}"></div><div class="fld"><label for="fvTel">Teléfono</label><input id="fvTel" value="${esc(p.tel || "")}"></div>
      <div class="dlg-f" style="grid-column:1/-1">${id ? `<button type="button" class="btn dan" data-act="delProv" data-id="${id}" style="margin-right:auto">Eliminar</button>` : ""}<button type="button" class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div></form>`);
  },
  delProv: id => confirmar("Eliminar proveedor", `¿Eliminar a <b>${esc(S.data.proveedores[id]?.nombre)}</b>?`, "Eliminar", () => seguro(() => borrar("proveedores", id), "Proveedor eliminado")),

  // clientes
  cliSel: id => { S.cliSel = S.cliSel === id ? null : id; render(); if (S.cliSel) $("#cliDet")?.scrollIntoView({ behavior: "smooth", block: "start" }); },
  cliCerrar: () => { S.cliSel = null; render(); },
  posNuevoCli: () => {
    const q = $("#posCliQ")?.value.trim() || "", texto = q && q !== (S.data.clientes[S.pos.cli]?.nombre || "") ? q : "";
    ACT.editCli(""); S.cliDesdePos = true;
    if (texto) { if (rut(texto).ok && rutLimpio(texto).length >= 8) $("#fcDoc").value = rut(texto).fmt; else $("#fcNombre").value = texto; }
  },
  posCliPick: id => {
    // al cambiar de cliente, cada producto toma el precio especial de ese cliente (o el normal), salvo los cambiados a mano
    S.pos.cli = id;
    for (const it of S.pos.items) if (!it.manual) it.precio = precioPara(it.pid);
    if (document.activeElement?.id === "posCliQ") document.activeElement.blur();
    render();
  },
  editCli: id => {
    S.cliDesdePos = false;
    const c = id ? S.data.clientes[id] : {};
    abrir(id ? "Editar cliente" : "Nuevo cliente", `<form data-form="cli" data-id="${id}" class="fgrid"><div class="fld w2"><label for="fcNombre">Nombre o razón social</label><input id="fcNombre" required value="${esc(c.nombre || "")}"></div>
      <div class="fld"><label for="fcDoc">RUT</label><input id="fcDoc" value="${esc(c.doc || "")}" placeholder="12.345.678-5" autocomplete="off"><span class="hint" id="fcDocHint">Opcional</span></div>
      <div class="fld"><label for="fcTel">Teléfono</label><input id="fcTel" inputmode="tel" value="${esc(c.tel || "")}" placeholder="+56 9 1234 5678"></div>
      <div class="fld w2"><label for="fcDir">Dirección</label><input id="fcDir" value="${esc(c.dir || "")}" placeholder="Calle, número, depto."></div>
      <div class="fld"><label for="fcComuna">Comuna</label><input id="fcComuna" value="${esc(c.comuna || "")}"></div>
      <div class="fld"><label for="fcEmail">Email</label><input id="fcEmail" type="email" value="${esc(c.email || "")}"></div>
      <div class="dlg-f" style="grid-column:1/-1">${id ? `<button type="button" class="btn dan" data-act="delCli" data-id="${id}" style="margin-right:auto">Eliminar</button>` : ""}<button type="button" class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div></form>`);
    rutHint($("#fcDoc"));
  },
  delCli: id => confirmar("Eliminar cliente", `¿Eliminar a <b>${esc(S.data.clientes[id]?.nombre)}</b>? Sus compras pasadas se conservan en los reportes.`, "Eliminar", () => seguro(async () => { await borrar("clientes", id); if (S.cliSel === id) S.cliSel = null; }, "Cliente eliminado")),
  abono: id => {
    const s = saldoCli(id);
    abrir(`Registrar pago · ${S.data.clientes[id].nombre}`, `<p>Saldo pendiente: <b>${money(s)}</b></p><form data-form="abono" data-id="${id}" class="fgrid"><div class="fld"><label for="abMonto">Monto</label><input id="abMonto" type="number" min="0.01" step="0.01" required value="${s > 0 ? Math.round(s * 100) / 100 : ""}"></div><div class="fld"><label for="abFecha">Fecha</label><input id="abFecha" type="date" value="${hoy()}"></div><div class="fld"><label for="abPago">Forma de pago</label><select id="abPago">${["efectivo", "debito", "credito", "transferencia"].map(k => `<option value="${k}">${PAGOS[k]}</option>`).join("")}</select></div>
      <div class="dlg-f" style="grid-column:1/-1"><button type="button" class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">Registrar pago</button></div></form>`);
  },

  // gastos
  delGasto: id => { const [k, gid] = id.split("|"); confirmar("Borrar gasto", "¿Borrar este gasto?", "Borrar", () => seguro(() => cambiarEnLista("gastos", k, gid, () => null), "Gasto borrado")); },

  // reportes y ajustes
  repTab: id => { S.repTab = id; render(); },
  tema: id => seguro(() => guardar("config", "negocio", { ...negocio(), tema: id })),
  backup: () => { if (S.modo === "demo") return toast("Sal de la demostración para respaldar tus datos.", true); descargar(`respaldo-vendimetro-${hoy()}.json`, JSON.stringify({ app: "vendimetro", version: 2, fecha: new Date().toISOString(), data: S.data })); },
  restaurar: () => $("#fileRestore").click(),
  respaldoYa: async () => {
    try { const r = await api("POST", "/api/respaldo"); toast("Copia de seguridad creada: " + r.archivo.split(/[\\/]/).pop()); }
    catch (e) { toast("No se pudo crear la copia de seguridad.", true); }
  },
  abrirCarpeta: () => api("POST", "/api/abrir-carpeta").catch(() => toast("No se pudo abrir la carpeta.", true)),
};

function leerCompraForm() {
  const c = S.compra; if (!$("#cmpProv")) return;
  c.prov = $("#cmpProv").value; c.fecha = $("#cmpFecha").value; c.nota = $("#cmpNota").value; c.actCosto = $("#cmpAct").checked;
}
function margenHint() {
  const c = num($("#fpCosto")?.value), p = num($("#fpPrecio")?.value), el = $("#fpMargen"); if (!el) return;
  el.textContent = p ? `Ganas ${money(p - c)} por unidad: margen ${pct((p - c) / p * 100)} del precio${c ? `, +${pct((p - c) / c * 100)} sobre el costo` : ""}` : "";
}

const FORM = {
  prod: async (f, id) => {
    const nombre = $("#fpNombre").value.trim(); if (!nombre) return;
    const base = id ? S.data.productos[id] : {};
    const pid = id || uid("p");
    const stock0 = id ? base.stock || 0 : Math.floor(num($("#fpStock").value));
    const p = { ...base, nombre, codigo: $("#fpCodigo").value.trim(), cat: $("#fpCat").value.trim(), costo: num($("#fpCosto").value), precio: num($("#fpPrecio").value), stock: stock0, min: Math.floor(num($("#fpMin").value)) };
    const ok = await seguro(async () => {
      await guardar("productos", pid, p);
      if (!id && stock0) await agregarALista("ajustes", hoy().slice(0, 7), { id: uid("a"), fecha: hoy(), hora: ahora(), pid, tipo: "inicial", delta: stock0, nota: "" });
    }, id ? "Cambios guardados" : `Producto «${nombre}» creado`);
    if (ok) cerrar();
  },
  ajuste: async (f, id) => {
    const p = S.data.productos[id], tipo = $("#ajTipo").value, n = Math.floor(num($("#ajCant").value));
    const delta = tipo === "entrada" ? n : tipo === "conteo" ? n - (p.stock || 0) : -n;
    if (!delta) return toast("No hay cambios en el stock.", true);
    const ok = await seguro(async () => {
      await agregarALista("ajustes", hoy().slice(0, 7), { id: uid("a"), fecha: hoy(), hora: ahora(), pid: id, tipo, delta, nota: $("#ajNota").value.trim() });
      await moverStock(id, delta);
    }, `Stock actualizado: ${nf.format((p.stock || 0) + delta)} unidades`);
    if (ok) cerrar();
  },
  prov: async (f, id) => {
    const d = { nombre: $("#fvNombre").value.trim(), contacto: $("#fvContacto").value.trim(), tel: $("#fvTel").value.trim() };
    if (await seguro(() => guardar("proveedores", id || uid("s"), d), "Proveedor guardado")) cerrar();
  },
  cli: async (f, id) => {
    const r = rut($("#fcDoc").value);
    if (!r.ok) { rutHint($("#fcDoc")); $("#fcDoc").focus(); return toast(r.msg, true); }
    if (r.fmt) {
      const otro = Object.entries(S.data.clientes).find(([cid, c]) => cid !== id && rutLimpio(c.doc) === rutLimpio(r.fmt));
      if (otro) { $("#fcDoc").focus(); return toast(`Ya hay un cliente con el RUT ${r.fmt}: ${otro[1].nombre}.`, true); }
    }
    const d = { ...(id ? S.data.clientes[id] : {}), nombre: $("#fcNombre").value.trim(), doc: r.fmt, tel: $("#fcTel").value.trim(), dir: $("#fcDir").value.trim(), comuna: $("#fcComuna").value.trim(), email: $("#fcEmail").value.trim() };
    const cid = id || uid("c"), paraVenta = !id && S.cliDesdePos;
    if (await seguro(() => guardar("clientes", cid, d), paraVenta ? `${d.nombre} creado y elegido para esta venta` : "Cliente guardado")) {
      if (paraVenta) { S.pos.cli = cid; for (const it of S.pos.items) if (!it.manual) it.precio = precioPara(it.pid); }
      S.cliDesdePos = false; cerrar(); render();
    }
  },
  abono: async (f, id) => {
    const fecha = $("#abFecha").value || hoy(), monto = num($("#abMonto").value);
    if (monto <= 0) return toast("El monto debe ser mayor a cero.", true);
    if (await seguro(() => agregarALista("abonos", fecha.slice(0, 7), { id: uid("b"), fecha, cli: id, monto, pago: $("#abPago").value }), `Pago de ${money(monto)} registrado`)) cerrar();
  },
  gasto: async () => {
    const fecha = $("#gFecha").value || hoy(), monto = num($("#gMonto").value);
    if (monto <= 0) return toast("Escribe el monto del gasto.", true);
    const g = { id: uid("g"), fecha, cat: $("#gCat").value, desc: $("#gDesc").value.trim(), monto, pago: $("#gPago").value };
    if (await seguro(() => agregarALista("gastos", fecha.slice(0, 7), g), `Gasto de ${money(monto)} registrado`)) { $("#gDesc").value = ""; $("#gMonto").value = ""; }
  },
  adminPin: async () => {
    try {
      const r = await api("POST", "/api/pin", { accion: "verificar", pin: $("#admPin").value });
      if (r.ok) return adminOk();
      toast("El código no es correcto.", true); $("#admPin").value = ""; $("#admPin").focus();
    } catch (e) { toast("No se pudo verificar el código.", true); }
  },
  adminCrear: async () => {
    const nuevo = $("#admNuevo").value;
    if (nuevo !== $("#admRepetir").value) return toast("Los dos códigos no coinciden.", true);
    try {
      const r = await api("POST", "/api/pin", { accion: "definir", nuevo });
      if (!r.ok) return toast(r.error, true);
      toast("Código de administrador creado"); adminOk();
    } catch (e) { toast("No se pudo guardar el código.", true); }
  },
  adminCambiar: async () => {
    const nuevo = $("#admNuevo").value;
    if (nuevo !== $("#admRepetir").value) return toast("Los dos códigos nuevos no coinciden.", true);
    try {
      const r = await api("POST", "/api/pin", { accion: "definir", actual: $("#admActual")?.value || "", nuevo });
      if (!r.ok) return toast(r.error, true);
      S.adminHasta = 0; cerrar(); toast("Código de administrador guardado"); render();
    } catch (e) { toast("No se pudo guardar el código.", true); }
  },
  posPrecio: async (f, id) => {
    const it = S.pos.items[+id]; if (!it) return cerrar();
    const precio = Math.round(num($("#ppPrecio").value) * 100) / 100;
    if (precio < 0) return toast("El precio no puede ser negativo.", true);
    it.precio = precio; it.manual = true;
    const especial = $("#ppEspecial")?.checked, cid = S.pos.cli;
    if (cid && especial != null) {
      const c = clone(S.data.clientes[cid]), antes = c.precios?.[it.pid];
      if (especial) { c.precios = { ...(c.precios || {}), [it.pid]: precio }; it.manual = false; }
      else if (c.precios) delete c.precios[it.pid];
      if (antes !== (especial ? precio : undefined)) {
        const ok = await seguro(() => guardar("clientes", cid, c), especial ? `Precio especial guardado para ${c.nombre}` : "");
        if (!ok) return;
      }
    }
    cerrar(); posTicket();
  },
  negocio: async () => {
    const r = rut($("#nDoc").value);
    if (!r.ok) { rutHint($("#nDoc")); $("#nDoc").focus(); return toast(r.msg, true); }
    const d = { ...negocio(), nombre: $("#nNombre").value.trim(), moneda: $("#nMoneda").value.trim() || "$", doc: r.fmt, dir: $("#nDir").value.trim(), tel: $("#nTel").value.trim(), pie: $("#nPie").value.trim() };
    await seguro(() => guardar("config", "negocio", d), "Datos del negocio guardados");
  },
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.id ?? "", el);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault(); FORM[f.dataset.form]?.(f, f.dataset.id || "");
});
document.addEventListener("input", e => {
  const t = e.target, id = t.id;
  if (id === "posQ") { S.pos.q = t.value; posGrid(); }
  else if (id === "posCliQ") posCliLista();
  else if (id === "posDesc") { S.pos.desc = t.value; posTotals(); }
  else if (id === "posRec") { S.pos.recibido = t.value; posTotals(); }
  else if (id === "posNota") S.pos.nota = t.value;
  else if (t.dataset.cant != null) {
    const it = S.pos.items[+t.dataset.cant], p = S.data.productos[it.pid], n = Math.floor(num(t.value));
    if (n >= 1) { if (p && n > it.cant) avisoStock(p, n); it.cant = n; posTotals(); }
  }
  else if (id === "fpCosto" || id === "fpPrecio") margenHint();
  else if (id === "fcDoc" || id === "nDoc") rutHint(t);
  else if (id === "ppPrecio") precioHint(S.pos.items[+t.closest("form").dataset.id]?.pid);
  else if (id === "prodQ") { S.prodQ = t.value; renderSoon(); }
  else if (id === "ventaQ") { S.ventaQ = t.value; renderSoon(); }
  else if (id === "cliQ") { S.cliQ = t.value; renderSoon(); }
});
document.addEventListener("change", e => {
  const t = e.target, id = t.id;
  if (id === "perDia") { if (t.value) { P.dia = t.value; render(); } }
  else if (id === "perMes") { P.m = +t.value; render(); }
  else if (id === "perAnio") { P.y = +t.value; render(); }
  else if (id === "perDesde") { if (t.value) { P.desde = t.value; render(); } }
  else if (id === "perHasta") { if (t.value) { P.hasta = t.value; render(); } }
  else if ((id === "fcDoc" || id === "nDoc") && rut(t.value).ok) { t.value = rut(t.value).fmt; rutHint(t); }
  else if (id === "posFecha") S.pos.fecha = t.value;
  else if (t.dataset.cant != null) posTicket();
  else if (id === "prodCat") { S.prodCat = t.value; render(); }
  else if (id === "prodBajo") { S.prodBajo = t.checked; render(); }
  else if (id === "impAuto") seguro(() => guardar("config", "negocio", { ...negocio(), impAuto: t.checked }), t.checked ? "Se imprimirá cada venta al cobrar" : "Ya no se imprimirá al cobrar");
  else if (id === "ventaPago") { S.ventaPago = t.value; render(); }
  else if (id === "ventaEstado") { S.ventaEstado = t.value; render(); }
  else if (id === "cmpProd") { const p = S.data.productos[t.value]; if (p) $("#cmpCosto").placeholder = `Actual: ${money(p.costo)}`; }
});
// tocar la lista no le quita el foco al buscador (si no, en Mac la lista se cierra antes de elegir)
document.addEventListener("mousedown", e => { if (e.target.closest(".cbox-list")) e.preventDefault(); });
document.addEventListener("focusin", e => { if (e.target.id === "posCliQ") { e.target.select(); posCliLista(); } });
document.addEventListener("focusout", e => { if (e.target.id === "posCliQ") setTimeout(() => { const b = $("#posCliList"); if (b && !b.contains(document.activeElement)) b.hidden = true; const i = $("#posCliQ"); if (i && document.activeElement !== i) i.value = S.data.clientes[S.pos.cli]?.nombre || ""; }, 200); });
document.addEventListener("keydown", e => {
  if (e.target.id === "posCliQ") {
    if (e.key === "Escape") { e.target.blur(); }
    else if (e.key === "Enter") { e.preventDefault(); const l = clientesQue(e.target.value); if (l.length === 1) ACT.posCliPick(l[0][0]); else if (!l.length) ACT.posNuevoCli(); }
  }
  if (e.key === "Enter" && e.target.id === "posQ") {
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const hit = prodsOrden().find(([, p]) => (p.codigo || "").toLowerCase() === q) || (() => { const l = prodsOrden().filter(([, p]) => p.nombre.toLowerCase().includes(q)); return l.length === 1 ? l[0] : null; })();
    if (hit) { ACT.posAdd(hit[0]); S.pos.q = ""; e.target.value = ""; posGrid(); }
  }
  if (e.key === "/" && S.page === "pos" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) { e.preventDefault(); $("#posQ")?.focus(); }
});
$("#fileRestore").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); if (!["vendimetro", "libro-ventas"].includes(d.app) || !d.data) throw 0; } catch (x) { return toast("El archivo no es un respaldo válido de esta aplicación.", true); }
  const n = COLS.reduce((s, c) => s + Object.keys(d.data[c] || {}).length, 0);
  confirmar("Restaurar respaldo", `Se cargarán ${n} registros del respaldo del ${new Date(d.fecha).toLocaleString(LOC)}. Los registros con el mismo identificador se reemplazarán.`, "Restaurar", () => seguro(async () => {
    let i = 0;
    for (const c of COLS) for (const [id, doc] of Object.entries(d.data[c] || {})) { await guardar(c, id, doc); if (++i % 25 === 0) toast(`Restaurando… ${i} de ${n}`); }
  }, "Respaldo restaurado"));
});

/* ===================== demostración ===================== */
function demoData() {
  const d = vacioData();
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  d.config.negocio = { nombre: "Almacén Demo", moneda: "$", pie: "¡Gracias por su compra!" };
  const prods = [["Café molido 500 g", "Almacén", 2800, 4500], ["Yerba mate 1 kg", "Almacén", 1900, 3100], ["Galletitas surtidas", "Almacén", 650, 1200], ["Aceite girasol 1,5 L", "Almacén", 2100, 3300], ["Leche entera 1 L", "Lácteos", 720, 1100], ["Queso cremoso kg", "Lácteos", 5200, 7900], ["Yogur bebible", "Lácteos", 600, 1050], ["Gaseosa cola 2,25 L", "Bebidas", 1500, 2600], ["Agua mineral 2 L", "Bebidas", 500, 950], ["Cerveza lata 473 ml", "Bebidas", 900, 1600], ["Detergente 750 ml", "Limpieza", 1100, 1900], ["Lavandina 2 L", "Limpieza", 700, 1250], ["Pan francés kg", "Panadería", 1200, 2200], ["Medialunas x6", "Panadería", 1400, 2800]];
  prods.forEach(([n, c, co, pr], i) => d.productos["dp" + i] = { nombre: n, cat: c, codigo: "779" + (100200 + i * 37), costo: co, precio: pr, stock: [40, 6, 55, 18, 3, 9, 24, 30, 0, 48, 14, 20, 12, 8][i], min: 8 });
  const calles = [["Los Aromos 123", "Ñuñoa"], ["Av. Pajaritos 2450", "Maipú"], ["San Diego 980", "Santiago"], ["Av. Perú 615", "Viña del Mar"], ["Pasaje Las Rosas 44", "La Florida"], ["Gran Avenida 5120", "San Miguel"]];
  ["Ana Torres", "Carlos Méndez", "Kiosco La Esquina", "Bar El Puerto", "Lucía Fernández", "Jorge Ruiz"].forEach((n, i) => {
    const cuerpo = String(i === 2 || i === 3 ? 76100000 + i * 23457 : 12000000 + i * 1234567);
    d.clientes["dc" + i] = { nombre: n, doc: rut(cuerpo + rutDV(cuerpo)).fmt, tel: `+56 9 ${5300 + i * 17} ${4400 + i * 131}`, dir: calles[i][0], comuna: calles[i][1] };
  });
  ["Distribuidora Norte", "Lácteos del Valle", "Bebidas Sur SA"].forEach((n, i) => d.proveedores["ds" + i] = { nombre: n, contacto: ["Pablo", "Marta", "Diego"][i], tel: `11 4${200 + i * 11} 99${10 + i}` });
  const fin = new Date(), ini = new Date(fin.getFullYear() - 1, 0, 1);
  let folio = 0;
  const pagos = ["efectivo", "efectivo", "efectivo", "debito", "debito", "credito", "transferencia", "fiado"];
  for (let x = new Date(ini); x <= fin; x.setDate(x.getDate() + 1)) {
    const f = iso(x), dow = x.getDay(); if (dow === 0 && r() < 0.6) continue;
    const growth = 1 + (x - ini) / (fin - ini) * 0.5, season = 1 + 0.25 * Math.sin((x.getMonth() + 1) / 12 * Math.PI * 2);
    const n = Math.max(1, Math.round((3 + r() * 6) * growth * season * (dow === 6 ? 1.5 : 1))), ventas = [];
    for (let k = 0; k < n; k++) {
      const items = [], used = new Set();
      for (let j = 0, m = 1 + Math.floor(r() * 3); j < m; j++) {
        const pi = Math.floor(Math.pow(r(), 1.3) * prods.length); if (used.has(pi)) continue; used.add(pi);
        const cant = 1 + Math.floor(r() * 3);
        items.push({ pid: "dp" + pi, nombre: prods[pi][0], cat: prods[pi][1], cant, precio: prods[pi][3], costo: prods[pi][2] });
      }
      let pago = pagos[Math.floor(r() * pagos.length)];
      if (pago === "fiado" && r() < 0.85) pago = "efectivo";
      const cli = pago === "fiado" || r() < 0.4 ? "dc" + Math.floor(Math.pow(r(), 1.5) * 6) : "";
      if (!cli && pago === "fiado") pago = "efectivo";
      const sub = items.reduce((a, i) => a + i.cant * i.precio, 0), desc = r() < 0.08 ? Math.round(sub * 0.1) : 0;
      ventas.push({ id: "dv" + f + k, folio: ++folio, hora: `${pad(8 + Math.floor(r() * 13))}:${pad(Math.floor(r() * 60))}`, cli, cliNombre: d.clientes[cli]?.nombre || "", items, sub, desc, total: sub - desc, costo: items.reduce((a, i) => a + i.cant * i.costo, 0), pago, recibido: 0, nota: "", estado: r() < 0.01 ? "anulada" : "ok" });
    }
    d.dias[f] = { ventas: ventas.map(v => ({ ...v, pagada: true })).sort((a, b) => a.hora.localeCompare(b.hora)) };
    if (x.getDate() === 1 || x.getDate() === 15) {
      const k = f.slice(0, 7), its = [0, 1, 4, 7, 12].map(i => ({ pid: "dp" + i, nombre: prods[i][0], cant: 20 + Math.floor(r() * 30), costo: prods[i][2] }));
      (d.compras[k] = d.compras[k] || { lista: [] }).lista.push({ id: "dk" + f, fecha: f, prov: "ds" + Math.floor(r() * 3), items: its, total: its.reduce((a, i) => a + i.cant * i.costo, 0), nota: "Factura A-" + (1000 + folio % 900) });
    }
    if (x.getDate() === 5) {
      const k = f.slice(0, 7), gl = (d.gastos[k] = d.gastos[k] || { lista: [] }).lista;
      gl.push({ id: "dg1" + k, fecha: f, cat: "Alquiler", desc: "Alquiler del local", monto: 180000, pago: "transferencia" });
      gl.push({ id: "dg2" + k, fecha: f, cat: "Servicios (luz, agua, internet)", desc: "Luz e internet", monto: 28000 + Math.round(r() * 12000), pago: "debito" });
      gl.push({ id: "dg3" + k, fecha: f, cat: "Sueldos", desc: "Sueldo empleado", monto: 320000, pago: "transferencia" });
    }
    if (x.getDate() === 20) {
      const k = f.slice(0, 7), mes = f.slice(0, 7);
      for (const c of Object.keys(d.clientes)) {
        const deuda = Object.entries(d.dias).filter(([dd]) => dd.startsWith(mes)).flatMap(([, v]) => v.ventas).filter(v => v.cli === c && v.pago === "fiado").reduce((a, v) => a + v.total, 0);
        if (deuda) (d.abonos[k] = d.abonos[k] || { lista: [] }).lista.push({ id: "db" + f + c, fecha: f, cli: c, monto: Math.round(deuda * (0.8 + r() * 0.2)), pago: "efectivo" });
      }
    }
  }
  d.config.negocio.folio = folio;
  return d;
}
